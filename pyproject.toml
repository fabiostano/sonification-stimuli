[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sonification-stimuli"
version = "0.1.0"
description = "Transparent harmonic-drone prototypes for auditory research"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "soundfile>=0.13,<1", "matplotlib>=3.10,<4"]

[project.scripts]
drone = "sonification_stimuli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
